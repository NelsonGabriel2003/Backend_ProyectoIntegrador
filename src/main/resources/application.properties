spring.application.name=LuluncotoApp

spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.port=${PORT:8080}

# Tamaño maximo del request body (para imagenes Base64)
server.tomcat.max-http-post-size=20971520
server.tomcat.max-swallow-size=20971520
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# JWT
jwt.secret=${JWT_SECRET}

# Serializar fechas como ISO String en lugar de arrays para no tener problemas
spring.jackson.serialization.write-dates-as-timestamps=false

# Ejecutar data.sql despues de que Hibernate cree las tablas
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always